name: Weekly health

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: PAX_SIM_MATCHES=250 npm run test:ai
      - run: npm run build
      - run: test $(du -sk dist | cut -f1) -lt 4096

  design-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          npm run simulate:matrix -- \
            --experiment simulation/experiments/persona-matrix.json \
            --output simulation/reports/persona-matrix \
            --baseline simulation/baselines/current-main.json
      - run: |
          npm run simulate:matrix -- \
            --experiment simulation/experiments/explorer-coverage.json \
            --output simulation/reports/explorer-coverage
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: design-simulation-reports
          path: simulation/reports/*
