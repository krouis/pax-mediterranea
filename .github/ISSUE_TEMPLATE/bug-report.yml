name: Bug report
description: Report reproducible incorrect behavior.
body:
  - type: textarea
    id: problem
    attributes: { label: What happened? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Browser and device }
