name: Weekly health

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: PAX_SIM_MATCHES=250 npm run test:ai
      - run: npm run build
      - run: test $(du -sk dist | cut -f1) -lt 4096
